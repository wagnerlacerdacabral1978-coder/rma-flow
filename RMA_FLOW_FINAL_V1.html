/* Cirion 1.1 visual layer */
body{background:linear-gradient(135deg,#f7f8fc 0%,#f2f4fb 100%)}
.sidebar{background:linear-gradient(180deg,#011689 0%,#00105f 100%);box-shadow:8px 0 28px rgba(1,22,137,.12)}
.brand{padding:10px 10px 22px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px}

.main{margin-left:245px}
.topbar{border-bottom:1px solid #e3e6f0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}
.btn.primary{background:var(--primary);border-color:var(--primary)}

.kpi{border-top:3px solid var(--primary)}
.kpi:nth-child(4){border-top-color:var(--magenta)}
.panel{border:1px solid #e4e7f0;box-shadow:var(--shadow)}
.page-head h1{color:var(--primary)}
.eyebrow{color:var(--magenta)!important}
.bar i{background:linear-gradient(90deg,var(--primary),var(--magenta))}
.flow .step.current{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(239,40,193,.10)}
.footer-developer{position:fixed;left:16px;bottom:12px;color:rgba(255,255,255,.88);font-size:10px;line-height:1.3;z-index:5}
.footer-developer b{display:block;color:#fff;font-size:11px}
.topbar .user-chip .avatar{background:var(--primary)}
.brand-accent{height:4px;width:72px;border-radius:4px;background:var(--magenta);margin-top:10px}
tbody tr{cursor:pointer}tbody tr:hover{background:#f8f7ff!important}
.priority-bars{display:grid;gap:8px}
@media(max-width:850px){.sidebar{width:205px}.main{margin-left:205px}.brand-logo{width:145px}.footer-developer{left:8px}}
@media print{
  body{background:#fff!important}
  .sidebar,.topbar,.page-head .actions,.no-print,.footer-developer{display:none!important}
  .main{margin-left:0!important}
  .content{padding:0!important}
  .panel{box-shadow:none!important;break-inside:avoid}
  .flow{break-inside:avoid}
}
.print-title{display:none}
.site-auto{background:#f3f7fb}.form-grid label input[readonly]{background:#f3f7fb;color:#475467;cursor:not-allowed}

}</small></div><nav class="nav">${[['dashboard','▦ Dashboard'],['orders','☷ Ordens de Serviço'],['mine','◉ Minhas OS'],...(u.role==='FSO'||u.role==='MASTER'?[['new','＋ Nova OS']]:[]),...(u.role==='MASTER'?[['users','◉ Usuários & acessos'],['settings','⚙ Configurações & Escalonamento']]:[]),['backup','⇩ Backup / Importação']].map(x=>`<button class="${active===x[0]?'active':''}" onclick="route('${x[0]}')">${x[1]}</button>`).join('')}</nav><div class="footer-note">Dados armazenados neste navegador.<br>Exporte o backup antes de trocar ou limpar o computador.</div><div class="footer-developer">Desenvolvido por<b>Wagner Lacerda Cabral</b></div></aside><main class="main"><header class="topbar"><b>${esc(active==='new'?'Nova OS':active==='orders'?'Ordens de Serviço':active==='mine'?'Minhas OS':active==='dashboard'?'Dashboard':active==='users'?'Usuários & acessos':active==='settings'?'Configurações & Escalonamento':'Backup / Importação')}</b><div class="user-chip"><span class="avatar">${esc(u.fullName[0])}</span><div><strong>${esc(u.fullName)}</strong><small>${esc(ROLES[u.role])}</small></div><button class="btn subtle" onclick="logout()">Sair</button></div></header><section class="content">${body}</section></main></div>`}
function render(){load();if(!db.session){login();return}const [view,arg]=location.hash.replace('#','').split('/');if(view==='order'&&arg){orderDetail(arg);return}if(view==='new'){newOrderPage();return}if(view==='orders'){ordersPage(false);return}if(view==='mine'){ordersPage(true);return}if(view==='users'){usersPage();return}if(view==='settings'){settingsPage();return}if(view==='backup'){backupPage();return}dashboard();}
function login(msg=''){$('#root').innerHTML=`<div class="login"><div class="login-card"><h1>Cirion BoardFlow</h1><p>Controle operacional de envio de placas para reparo</p>${msg?`<div class="alert red">${esc(msg)}</div>`:''}<form class="stack" onsubmit="doLogin(event)"><label>Usuário<input id="loginUser" autocomplete="username" oninput="autoFillPassword()" onblur="autoFillPassword()" required autofocus></label><label>Senha<input id="loginPass" type="password" autocomplete="current-password" required></label><button class="btn primary">Entrar</button></form><div class="demo-creds"><b>Acessos de demonstração</b><br>master / Cirion@123 · fso / FSO@123 · fed / FED@123 · fiscal / Fiscal@123 · phl / PHL@123</div></div></div>`}
function autoFillPassword(){const input=$('#loginUser'), pass=$('#loginPass'); if(!input||!pass)return; const username=input.value.trim().toLowerCase(); const u=db.users.find(x=>x.username.toLowerCase()===username&&x.active!==false); pass.value=u?u.password:'';}
function doLogin(e){e.preventDefault();const u=db.users.find(x=>x.username.toLowerCase()===$('#loginUser').value.trim().toLowerCase()&&x.password===$('#loginPass').value);if(!u){login('Usuário ou senha inválidos.');return}db.session={userId:u.id,at:iso(now())};save();route('dashboard')}
function logout(){db.session=null;save();location.hash='';render()}
function dashboard(){const u=currentUser(), open=db.orders.filter(o=>o.status!=='ENCERRADA'), mine=open.filter(o=>o.assignedRole===u.role), breached=open.filter(o=>slaInfo(o)[1]==='red'), rej=db.events.filter(e=>e.action==='REJEITADA').length, closed=db.orders.filter(o=>o.status==='ENCERRADA'), firstPass=closed.filter(o=>!db.events.some(e=>e.orderId===o.id&&e.action==='REJEITADA')).length, avg=closed.length?closed.reduce((a,o)=>a+(new Date(o.closedAt)-new Date(o.createdAt))/36e5,0)/closed.length:0;const counts={};open.forEach(o=>counts[o.stage]=(counts[o.stage]||0)+1);layout(`<div class="page-head"><div><span class="eyebrow">VISÃO OPERACIONAL</span><h1>Dashboard</h1><p>Fila de placas/equipamentos para reparo e movimentação.</p></div><button class="btn primary" onclick="route('new')" ${u.role==='FSO'||u.role==='MASTER'?'':'disabled'}>＋ Abrir nova OS</button></div><div class="kpis"><div class="kpi"><small>Backlog aberto</small><strong>${open.length}</strong><span>OS em andamento</span></div><div class="kpi"><small>Na sua fila</small><strong>${mine.length}</strong><span>${ROLE_SHORT[u.role]}</span></div><div class="kpi"><small>SLA vencido</small><strong>${breached.length}</strong><span>etapas críticas</span></div><div class="kpi"><small>Rejeições</small><strong>${rej}</strong><span>retrabalho registrado</span></div><div class="kpi"><small>Encerradas</small><strong>${closed.length}</strong><span>coletas concluídas</span></div><div class="kpi"><small>Lead time médio</small><strong>${avg?avg.toFixed(1):'—'}h</strong><span>abertura → encerramento</span></div></div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Backlog por etapa</h2><p class="muted">Distribuição atual da fila</p></div></div>${Object.entries(STAGES).map(([k,v])=>{let n=counts[k]||0;return `<div class="barrow"><span>${esc(v.label.split('·')[1]||v.label)}</span><div class="bar"><i style="width:${Math.max(n?4:0,Math.min(100,n*20))}%"></i></div><b>${n}</b></div>`}).join('')}</section><section class="panel"><div class="panel-head"><div><h2>Minha fila</h2><p class="muted">OS aguardando sua ação</p></div><button class="btn ghost" onclick="route('orders')">Abrir fila</button></div>${mine.slice(0,6).map(orderMini).join('')||'<div class="empty">Nenhuma OS na sua fila.</div>'}</section></div><section class="panel"><div class="panel-head"><div><h2>Indicadores por prioridade</h2><p class="muted">Distribuição do backlog aberto</p></div></div><div class="priority-bars">${Object.entries(PRIOR).map(([k,v])=>{const n=open.filter(o=>o.priority===k).length,pct=open.length?Math.round(n/open.length*100):0;return `<div class="barrow"><span>${v}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${n}</b></div>`}).join()}</div></section><section class="panel"><div class="panel-head"><div><h2>Próximas coletas</h2><p class="muted">Agenda dos próximos 7 dias</p></div></div>${db.orders.filter(o=>o.pickupScheduledAt&&o.status!=='ENCERRADA'&&new Date(o.pickupScheduledAt)<=new Date(Date.now()+7*864e5)).sort((a,b)=>new Date(a.pickupScheduledAt)-new Date(b.pickupScheduledAt)).map(o=>`<div class="notice" style="margin:7px 0"><b>${esc(o.osCode||o.taskNumber)}</b> · ${esc(o.siteId)} · ${fmt(o.pickupScheduledAt)} · ${statusP(o.status)}</div>`).join('')||'<div class="empty">Nenhuma coleta agendada para os próximos 7 dias.</div>'}</section>`, 'dashboard');}
function orderMini(o){return `<div class="notice" style="margin:7px 0;cursor:pointer" onclick="route('order','${o.id}')"><b>${esc(o.osCode||o.taskNumber)}</b> · ${esc(o.siteId||'—')} · ${esc(o.descriptionModel)}<br>${statusP(o.status)} ${priorityP(o.priority)} <span class="muted">${esc(STAGES[o.stage].label)}</span></div>`}
function ordersPage(onlyMine=false){let q=new URLSearchParams(location.hash.includes('?')?location.hash.split('?')[1]:'').get('q')||'';const title=onlyMine?'Minhas OS':'Ordens de Serviço';layout(`<div class="page-head"><div><span class="eyebrow">${onlyMine?'ACOMPANHAMENTO PESSOAL':'FILA OPERACIONAL'}</span><h1>${title}</h1><p>${onlyMine?'OS atribuídas ao seu perfil e pendências sob sua responsabilidade.':'Pesquisar por Task, OS, site, SAP, serial, RMA, SO ou NF.'}</p></div><div class="actions"><button class="btn ghost no-print" onclick="exportOrdersCSV(${onlyMine})">⇩ Exportar CSV</button><button class="btn primary no-print" onclick="route('new')" ${['FSO','MASTER'].includes(currentUser().role)?'':'disabled'}>＋ Nova OS</button></div></div><section class="panel no-print"><div class="filters"><input id="orderSearch" value="${esc(q)}" placeholder="Buscar Task, OS, SAP, serial, RMA, SO, NF..." oninput="filterOrders(${onlyMine})"><select id="stageFilter" onchange="filterOrders(${onlyMine})"><option value="">Todas as etapas</option>${Object.entries(STAGES).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('')}</select><select id="statusFilter" onchange="filterOrders(${onlyMine})"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="priorityFilter" onchange="filterOrders(${onlyMine})"><option value="">Todas prioridades</option>${Object.entries(PRIOR).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="slaFilter" onchange="filterOrders(${onlyMine})"><option value="">Todos SLA</option><option value="red">Vencido</option><option value="amber">Atenção</option><option value="green">No prazo</option></select></div></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>OS / Task</th><th>Site</th><th>Material</th><th>Etapa</th><th>Status</th><th>Prioridade</th><th>Responsável</th><th>SLA</th><th>Coleta</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>`,'orders');filterOrders(onlyMine)}
function filterOrders(onlyMine=false){const q=($('#orderSearch')?.value||'').toLowerCase().trim(),sf=$('#stageFilter')?.value||'',st=$('#statusFilter')?.value||'',pf=$('#priorityFilter')?.value||'',slaf=$('#slaFilter')?.value||'',u=currentUser();let rows=db.orders.filter(o=>{if(onlyMine&&o.assignedRole!==u.role)return false;if(sf&&o.stage!==sf)return false;if(st&&o.status!==st)return false;if(pf&&o.priority!==pf)return false;if(slaf&&slaInfo(o)[1]!==slaf)return false;if(!q)return true;return [o.osCode,o.taskNumber,o.siteId,o.siteName,o.sapCode,o.serialInstalled,o.serialRemoved,o.rmaNumber,o.soNumber,o.nfNumber,o.deliveryNumber].join(' ').toLowerCase().includes(q)});rows.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));$('#ordersBody').innerHTML=rows.map(orderRow).join('')||`<tr><td colspan="9"><div class="empty">Nenhuma OS encontrada.</div></td></tr>`}
function siteOptions(selected=''){return `<option value="">Selecione o site...</option>${SITE_CATALOG.map(x=>`<option value="${esc(x.code)}" ${selected===x.code?'selected':''}>${esc(x.code)} · ${esc(x.name)}</option>`).join('')}`}
function applySiteInfo(){const code=$('#siteId')?.value||'';const site=SITE_CATALOG.find(x=>x.code===code);const set=(id,val)=>{const el=$(id);if(el)el.value=val||'';};set('#siteName',site?.name||'');set('#siteAddress',site?.address||'');set('#region',site?.region||'');}
function initialFields(o={}){return `<div class="section-title"><h3>Identificação da atividade</h3><p>Campos do formulário inicial FSO.</p></div><div class="form-grid"><label>Task / Change *<input name="taskNumber" required value="${esc(o.taskNumber)}"></label><label>Data da substituição *<input name="substitutionDate" type="date" required value="${esc(o.substitutionDate)}"></label><label>Fabricante *<select name="manufacturer" required><option value="">Selecione</option>${MF.map(x=>`<option ${o.manufacturer===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Cód. SAP *<input id="sapCode" name="sapCode" required value="${esc(o.sapCode)}" autocomplete="off" oninput="lookupSapDescription(this.value)" onblur="lookupSapDescription(this.value)"><small id="sapLookupStatus" class="muted"></small></label><label>Descrição / Modelo *<input id="descriptionModel" name="descriptionModel" required value="${esc(o.descriptionModel)}" autocomplete="off"><small class="muted">Preenchida automaticamente ao informar um Cód. SAP válido.</small></label><label>Site / Código *<select id="siteId" name="siteId" required onchange="applySiteInfo()">${siteOptions(o.siteId)}</select></label><label>Nome do site<input id="siteName" name="siteName" readonly value="${esc(o.siteName)}" placeholder="Preenchido automaticamente"></label><label class="span2">Endereço do site<input id="siteAddress" name="siteAddress" readonly value="${esc(o.siteAddress)}" placeholder="Preenchido automaticamente"></label><label>Região / UF<input id="region" name="region" readonly value="${esc(o.region)}" placeholder="Preenchido automaticamente"></label><label>Responsável FSO *<input id="responsavelFSO" name="responsavelFSO" required value="${esc(o.responsavelFSO||"")}" autocomplete="name" placeholder="Informe o nome de quem está iniciando o processo"></label></div><div class="section-title"><h3>Placa instalada / desinstalada</h3></div><div class="form-grid"><label>Serial instalada (ZLSP) *<input name="serialInstalled" required value="${esc(o.serialInstalled)}"></label><label>Asset Tag instalada (ZLSP) *<input name="assetTagInstalled" required value="${esc(o.assetTagInstalled)}"></label><label>Planta de estoque instalada *<input name="stockPlantInstalled" required value="${esc(o.stockPlantInstalled)}"></label><label>Serial desinstalada (ZBRD + ZOSA) *<input name="serialRemoved" required value="${esc(o.serialRemoved)}"></label><label>Asset Tag desinstalada *<input name="assetTagRemoved" required value="${esc(o.assetTagRemoved)}"></label><label>Número RMA *<input name="rmaNumber" required value="${esc(o.rmaNumber)}"></label><label>Peso total (Kg) *<input name="weightTotalKg" required value="${esc(o.weightTotalKg)}"></label><label>Dimensões *<input name="materialDimensions" required value="${esc(o.materialDimensions)}"></label><label>UberAll preenchido? *<select name="uberallOk"><option ${o.uberallOk==='SIM'?'selected':''}>SIM</option><option ${o.uberallOk==='NÃO'?'selected':''}>NÃO</option></select></label><label>ZLSP gerada pelo SUCS *<input name="zlspSucsNumber" required value="${esc(o.zlspSucsNumber)}"></label><label class="span2">Observações *<textarea name="initialObservations" rows="3" required>${esc(o.initialObservations)}</textarea></label></div>`}
function newOrderPage(){const draft=getLatestDraft();const o=makeOrder(draft?{...draft,fso_responsible:currentUser()?.fullName||draft.fsoResponsible}:{});layout(`<div class="page-head"><div><span class="eyebrow">FORMULÁRIO INICIAL · FSO</span><h1>Abrir nova OS</h1><p>Preencha a abertura e escolha entre salvar como rascunho ou salvar e enviar ao FED.</p></div></div>${draft?`<div class="alert blue">📝 <b>Rascunho recuperado.</b> Último rascunho salvo em ${fmt(draft.savedAt)}. <button type="button" class="btn subtle" onclick="clearDraft();location.reload()">Descartar rascunho</button></div>`:''}<form id="newOrderForm" class="panel" onsubmit="createOrder(event)">${initialFields(o)}<div class="form-grid"><label>SLA global da OS (horas) *<input name="overallSlaHours" type="number" min="1" value="${draft?.overallSlaHours||db.settings.globalSla}" required></label><label>Observação interna<textarea name="internalNote" rows="2">${esc(draft?.internalNote||'OS criada pelo fluxo FSO.')}</textarea></label></div><div class="actions"><button type="button" class="btn subtle" onclick="route('dashboard')">Cancelar</button><button type="button" class="btn ghost" onclick="saveNewOrderDraft(event)">💾 Salvar</button><button class="btn success">Salvar e enviar ao FED</button></div></form>`,'new')}
function readForm(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);return o}
function getLatestDraft(){const u=currentUser();return (db.drafts||[]).filter(d=>d.userId===u?.id).sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt))[0]||null}
function saveNewOrderDraft(e){const form=document.getElementById('newOrderForm');if(!form)return;const f=readForm(form),u=currentUser();if(!u)return;db.drafts=(db.drafts||[]).filter(d=>d.userId!==u.id);db.drafts.push({...f,id:uid(),userId:u.id,savedAt:iso(now()),fsoResponsible:u.fullName});save();addToast('Rascunho salvo com sucesso.');}
function clearDraft(){const u=currentUser();db.drafts=(db.drafts||[]).filter(d=>d.userId!==u?.id);save();addToast('Rascunho descartado.');}
function createOrder(e){e.preventDefault();const f=readForm(e.target);if(db.orders.some(o=>o.taskNumber.toLowerCase()===f.taskNumber.toLowerCase())){addToast('A Task/Change já existe.');return}const o=makeOrder({task_number:f.taskNumber,substitution_date:f.substitutionDate,manufacturer:f.manufacturer,sap_code:f.sapCode,description_model:f.descriptionModel,equipment_name:f.equipmentName,site_id:f.siteId,site_name:f.siteName,site_address:f.siteAddress,region:f.region,fso_responsible:f.fsoResponsible||currentUser().fullName,priority:f.priority,serial_installed:f.serialInstalled,asset_tag_installed:f.assetTagInstalled,stock_plant_installed:f.stockPlantInstalled,serial_removed:f.serialRemoved,asset_tag_removed:f.assetTagRemoved,rma_number:f.rmaNumber,weight_total_kg:f.weightTotalKg,material_dimensions:f.materialDimensions,uberall_ok:f.uberallOk,zlsp_sucs_number:f.zlspSucsNumber,initial_observations:f.initialObservations,overall_sla_hours:f.overallSlaHours});const ym=new Date().toISOString().slice(0,7).replace('-','');const seq=db.orders.filter(x=>(x.osCode||'').startsWith('BF-'+ym+'-')).length+1;o.osCode='BF-'+ym+'-'+String(seq).padStart(4,'0');o.createdBy=currentUser().id;o.assignedRole='FED';o.stage='FED_SO_DELIVERY';db.orders.push(o);addEvent(o,'CRIADA',null,o.stage,f.internalNote||'OS criada e enviada ao FED.');addStage(o,o.stage);db.drafts=(db.drafts||[]).filter(d=>d.userId!==currentUser().id);save();addToast('OS criada com sucesso.');route('order',o.id)}
function flow(o){const codes=['FED_SO_DELIVERY','RI_AUDIT','FED_NF_LOGISTICA','PHL_AGENDAMENTO','FSO_AGUARDANDO_COLETA'];return `<div class="flow">${codes.map(c=>{const idx=codes.indexOf(c),cur=codes.indexOf(o.stage),done=idx<cur||o.status==='ENCERRADA';return `<div class="step ${c===o.stage?'current':''} ${done?'done':''}"><b>${done?'✓ ':''}${esc(STAGES[c].label.split('·')[1]||STAGES[c].label)}</b><small>${esc(ROLE_SHORT[STAGES[c].role])}</small></div>`}).join('')}</div>`}

function initialReadOnly(o){return `<div class="summary">${[['Task / Change',o.taskNumber],['Substituição',dateOnly(o.substitutionDate)],['Fabricante',o.manufacturer],['SAP',o.sapCode],['Serial instalada',o.serialInstalled],['Asset instalada',o.assetTagInstalled],['Planta',o.stockPlantInstalled],['Serial retirada',o.serialRemoved],['Asset retirada',o.assetTagRemoved],['Peso',o.weightTotalKg],['Dimensões',o.materialDimensions],['UberAll',o.uberallOk],['ZLSP SUCS',o.zlspSucsNumber],['Observações',o.initialObservations]].map(x=>`<div><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}</div>`}
function startOrder(id){const o=db.orders.find(x=>x.id===id);if(!o||!canStart(o))return;o.status='EM_TRATATIVA';o.assignedUserId=currentUser().id;o.updatedAt=iso(now());const s=db.stages.find(x=>x.orderId===id&&x.stage===o.stage&&!x.startedAt);if(s){s.startedAt=iso(now());s.actorUserId=currentUser().id}addEvent(o,'INICIADA',o.stage,o.stage,'Tratativa iniciada pelo responsável.');save();render()}
function stagePanel(o){if(!canAct(o)||o.status==='ENCERRADA')return `<section class="panel"><h2>Tratativa da etapa</h2><div class="notice">A OS está atribuída a <b>${esc(o.assignedRole)}</b>. Usuário atual: ${esc(currentUser().fullName)}.</div></section>`;if(o.status==='AGUARDANDO_INICIO'||o.status==='REJEITADA')return `<section class="panel"><h2>Tratativa</h2><div class="alert red">Clique em <b>Iniciar OS</b> para assumir esta etapa.</div></section>`;const code=o.stage;if(code==='FED_SO_DELIVERY')return `<section class="panel"><h2>FED · SO + Delivery</h2><p class="muted">Registrar SO e Delivery no processo SAP.</p><form class="form-grid" onsubmit="saveStage(event,'fedso')"><label>SO / requisição ZOSA *<input name="soNumber" required value="${esc(o.soNumber)}"></label><label>Delivery *<input name="deliveryNumber" required value="${esc(o.deliveryNumber)}"></label><label class="span2">Observações FED<textarea name="fedSoNotes">${esc(o.fedSoNotes)}</textarea></label><div class="actions span2"><button class="btn success">Salvar e enviar ao RI/Fiscal</button></div></form></section>`;
if(code==='RI_AUDIT')return `<section class="panel"><h2>RI / Fiscalização · Auditoria</h2><div class="summary"><div><span>SO</span><b>${esc(o.soNumber)}</b></div><div><span>Delivery</span><b>${esc(o.deliveryNumber)}</b></div><div><span>Task</span><b>${esc(o.taskNumber)}</b></div><div><span>SAP</span><b>${esc(o.sapCode)}</b></div></div><form class="stack" style="margin-top:14px" onsubmit="saveStage(event,'fiscal')"><label>Parecer / observação<textarea name="fiscalAuditNote" rows="3">${esc(o.fiscalAuditNote)}</textarea></label><button class="btn success">✓ Aprovar e devolver ao FED</button></form></section>`;
if(code==='FED_NF_LOGISTICA')return `<section class="panel"><h2>FED · NF + Dados Logísticos</h2>${o.fiscalApproved?'<div class="alert green">✓ RI/Fiscalização aprovou. Liberado para emissão da NF.</div>':'<div class="alert red">Aprovação fiscal não registrada.</div>'}<form class="form-grid" onsubmit="saveStage(event,'fednf')"><label>NF *<input name="nfNumber" required value="${esc(o.nfNumber)}"></label><label>Data emissão NF *<input type="date" name="nfIssueDate" required value="${esc(o.nfIssueDate)}"></label><label>Chave NF-e<input name="nfKey" value="${esc(o.nfKey)}"></label><label>Transação SAP NF<input name="nfSapTransaction" value="${esc(o.nfSapTransaction)}"></label><label class="span2">Endereço de coleta *<input name="pickupAddress" required value="${esc(o.pickupAddress)}"></label><label>Contato coleta *<input name="pickupContactName" required value="${esc(o.pickupContactName)}"></label><label>Telefone coleta<input name="pickupContactPhone" value="${esc(o.pickupContactPhone)}"></label><label>E-mail coleta<input name="pickupContactEmail" type="email" value="${esc(o.pickupContactEmail)}"></label><label>Janela coleta<input name="pickupWindow" value="${esc(o.pickupWindow)}"></label><label class="span2">Endereço entrega *<input name="deliveryAddress" required value="${esc(o.deliveryAddress)}"></label><label>Contato entrega *<input name="deliveryContactName" required value="${esc(o.deliveryContactName)}"></label><label>Telefone entrega<input name="deliveryContactPhone" value="${esc(o.deliveryContactPhone)}"></label><label>E-mail entrega<input name="deliveryContactEmail" type="email" value="${esc(o.deliveryContactEmail)}"></label><label>Quantidade volumes *<input name="quantityVolumes" required value="${esc(o.quantityVolumes)}"></label><label>Tipo embalagem<input name="packageType" value="${esc(o.packageType)}"></label><label>Peso logístico *<input name="logisticsWeightKg" required value="${esc(o.logisticsWeightKg||o.weightTotalKg)}"></label><label>Dimensões *<input name="logisticsDimensions" required value="${esc(o.logisticsDimensions||o.materialDimensions)}"></label><label class="span2">Descrição carga *<input name="cargoDescription" required value="${esc(o.cargoDescription||o.descriptionModel)}"></label><label class="span2">Instruções manuseio<textarea name="handlingInstructions">${esc(o.handlingInstructions)}</textarea></label><label class="span2">Observações transportadora<textarea name="transportNotes">${esc(o.transportNotes)}</textarea></label><div class="actions span2"><button class="btn success">Salvar e enviar à PHL</button></div></form></section>`;
if(code==='PHL_AGENDAMENTO')return `<section class="panel"><h2>PHL · Agendamento</h2><form class="form-grid" onsubmit="saveStage(event,'phl')"><label>Data / hora agendada *<input name="pickupScheduledAt" type="datetime-local" required value="${esc((o.pickupScheduledAt||'').slice(0,16))}"></label><label>Protocolo PHL<input name="phlProtocol" value="${esc(o.phlProtocol)}"></label><label>Contato PHL<input name="phlContactName" value="${esc(o.phlContactName)}"></label><label>Telefone PHL<input name="phlContactPhone" value="${esc(o.phlContactPhone)}"></label><div class="actions span2"><button class="btn success">Confirmar agendamento e enviar à FSO</button></div></form></section>`;
if(code==='FSO_AGUARDANDO_COLETA')return `<section class="panel"><h2>FSO · Confirmação da coleta</h2><div class="alert green">Coleta programada: <b>${fmt(o.pickupScheduledAt)}</b> · ${esc(o.phlProtocol)}</div><form class="form-grid" onsubmit="saveStage(event,'close')"><label>Data / hora efetiva *<input name="actualPickupAt" type="datetime-local" required value="${esc((o.actualPickupAt||'').slice(0,16))}"></label><label>Quem coletou *<input name="collectorName" required value="${esc(o.collectorName)}"></label><label>Documento coletor<input name="collectorDocument" value="${esc(o.collectorDocument)}"></label><label>Placa veículo<input name="vehiclePlate" value="${esc(o.vehiclePlate)}"></label><label>Protocolo coleta<input name="collectionProtocol" value="${esc(o.collectionProtocol)}"></label><label>Responsável logística *<input name="logisticsResponsible" required value="${esc(o.logisticsResponsible)}"></label><label>Volumes confirmados *<input name="confirmedVolumes" required value="${esc(o.confirmedVolumes||o.quantityVolumes)}"></label><label>Condição material<input name="materialCondition" value="${esc(o.materialCondition)}"></label><label class="span2">Observações fechamento<textarea name="closingNotes">${esc(o.closingNotes)}</textarea></label><div class="actions span2"><button class="btn success">✓ Confirmar coleta e encerrar OS</button></div></form></section>`;
return `<section class="panel"><h2>Correção FSO</h2><form onsubmit="resubmitCorrection(event)">${initialFields(o)}<div class="actions"><button class="btn success">Correções concluídas · reenviar ao FED</button></div></form></section>`}
function saveStage(e,type){e.preventDefault();const o=db.orders.find(x=>x.id===location.hash.split('/')[1]),f=readForm(e.target);if(!o)return;if(type==='fedso'){Object.assign(o,{soNumber:f.soNumber,deliveryNumber:f.deliveryNumber,fedSoNotes:f.fedSoNotes});transition(o,'RI_AUDIT','SO_DELIVERY_CONCLUIDA','SO/Delivery registrados.')}else if(type==='fiscal'){o.fiscalApproved=true;o.fiscalApprovedAt=iso(now());o.fiscalApprovedBy=currentUser().id;o.fiscalAuditNote=f.fiscalAuditNote;transition(o,'FED_NF_LOGISTICA','AUDITORIA_APROVADA','Auditoria aprovada.')}else if(type==='fednf'){Object.assign(o,{nfNumber:f.nfNumber,nfIssueDate:f.nfIssueDate,nfKey:f.nfKey,nfSapTransaction:f.nfSapTransaction,pickupAddress:f.pickupAddress,pickupContactName:f.pickupContactName,pickupContactPhone:f.pickupContactPhone,pickupContactEmail:f.pickupContactEmail,pickupWindow:f.pickupWindow,deliveryAddress:f.deliveryAddress,deliveryContactName:f.deliveryContactName,deliveryContactPhone:f.deliveryContactPhone,deliveryContactEmail:f.deliveryContactEmail,quantityVolumes:f.quantityVolumes,packageType:f.packageType,logisticsWeightKg:f.logisticsWeightKg,logisticsDimensions:f.logisticsDimensions,cargoDescription:f.cargoDescription,handlingInstructions:f.handlingInstructions,transportNotes:f.transportNotes});transition(o,'PHL_AGENDAMENTO','NF_LOGISTICA_CONCLUIDA','NF e dados logísticos concluídos.')}else if(type==='phl'){Object.assign(o,{pickupScheduledAt:new Date(f.pickupScheduledAt).toISOString(),phlProtocol:f.phlProtocol,phlContactName:f.phlContactName,phlContactPhone:f.phlContactPhone});transition(o,'FSO_AGUARDANDO_COLETA','COLETA_AGENDADA','Coleta agendada pela PHL.');o.status='AGUARDANDO_COLETA'}else if(type==='close'){Object.assign(o,{actualPickupAt:new Date(f.actualPickupAt).toISOString(),collectorName:f.collectorName,collectorDocument:f.collectorDocument,vehiclePlate:f.vehiclePlate,collectionProtocol:f.collectionProtocol,logisticsResponsible:f.logisticsResponsible,confirmedVolumes:f.confirmedVolumes,materialCondition:f.materialCondition,closingNotes:f.closingNotes});if(!db.attachments.some(a=>a.orderId===o.id&&(a.type==='ASSINATURA_COLETA'||a.type==='COMPROVANTE_COLETA'))){if(!confirm('Não há assinatura/comprovante de coleta anexado. Encerrar mesmo assim?'))return}o.status='ENCERRADA';o.closedAt=iso(now());o.closedBy=currentUser().id;o.updatedAt=iso(now());const s=db.stages.find(x=>x.orderId===o.id&&x.stage===o.stage&&!x.completedAt);if(s){s.completedAt=iso(now());s.outcome='ENCERRADA';s.actorUserId=currentUser().id}s&& (s.note='Coleta confirmada.');addEvent(o,'ENCERRADA',o.stage,null,'Coleta confirmada e OS encerrada.')}save();addToast(type==='close'?'OS encerrada.':'Etapa concluída.');render()}
function transition(o,target,action,note){const old=o.stage;const s=db.stages.find(x=>x.orderId===o.id&&x.stage===old&&!x.completedAt);if(s){s.completedAt=iso(now());s.outcome=action;s.actorUserId=currentUser().id;s.note=note}o.stage=target;o.assignedRole=STAGES[target].role;o.assignedUserId=null;o.status='AGUARDANDO_INICIO';o.stageEnteredAt=iso(now());o.updatedAt=iso(now());addStage(o,target);addEvent(o,action,old,target,note)}
function rejectionPanel(o){const targets={FED_SO_DELIVERY:'FSO_CORRECAO',RI_AUDIT:'FED_SO_DELIVERY',FED_NF_LOGISTICA:'RI_AUDIT',PHL_AGENDAMENTO:'FED_NF_LOGISTICA',FSO_AGUARDANDO_COLETA:'PHL_AGENDAMENTO'};const t=targets[o.stage];if(!t)return '';return `<section class="panel danger-panel"><h2>Rejeitar / devolver</h2><p class="muted">A justificativa é obrigatória e ficará registrada na auditoria.</p><form class="stack" onsubmit="rejectOrder(event,'${t}')"><label>Motivo da rejeição<textarea name="note" rows="3" required></textarea></label><button class="btn danger">Rejeitar e devolver para ${esc(ROLE_SHORT[STAGES[t].role])}</button></form></section>`}
function rejectOrder(e,target){e.preventDefault();const o=db.orders.find(x=>x.id===location.hash.split('/')[1]),note=e.target.note.value.trim();if(!note)return;transition(o,target,'REJEITADA',note);o.status='REJEITADA';save();addToast('OS devolvida para correção.');render()}
function resubmitCorrection(e){e.preventDefault();const o=db.orders.find(x=>x.id===location.hash.split('/')[1]),f=readForm(e.target);Object.assign(o,{taskNumber:f.taskNumber,substitutionDate:f.substitutionDate,manufacturer:f.manufacturer,sapCode:f.sapCode,descriptionModel:f.descriptionModel,equipmentName:f.equipmentName,siteId:f.siteId,siteName:f.siteName,siteAddress:f.siteAddress,region:f.region,priority:f.priority,serialInstalled:f.serialInstalled,assetTagInstalled:f.assetTagInstalled,stockPlantInstalled:f.stockPlantInstalled,serialRemoved:f.serialRemoved,assetTagRemoved:f.assetTagRemoved,rmaNumber:f.rmaNumber,weightTotalKg:f.weightTotalKg,materialDimensions:f.materialDimensions,uberallOk:f.uberallOk,zlspSucsNumber:f.zlspSucsNumber,initialObservations:f.initialObservations});transition(o,'FED_SO_DELIVERY','CORRECAO_CONCLUIDA','Correção FSO concluída e reenviada ao FED.');save();addToast('Correções reenviadas ao FED.');render()}
function exceptionalPanel(o){return `<details class="panel"><summary><b>Encaminhamento excepcional</b> — exige justificativa</summary><form class="form-grid" style="margin-top:12px" onsubmit="exceptional(event)"><label>Destino<select name="target">${Object.entries(STAGES).filter(([k])=>k!==o.stage).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label><label>Justificativa *<input name="note" required></label><div class="actions span2"><button class="btn ghost">Encaminhar</button></div></form></details>`}
function exceptional(e){e.preventDefault();const o=db.orders.find(x=>x.id===location.hash.split('/')[1]),f=readForm(e.target);transition(o,f.target,'ENCAMINHAMENTO_EXCEPCIONAL',f.note);save();render()}
function uploadAttachments(id){const files=[...$('#attFile').files],type=$('#attType').value;if(!files.length){addToast('Selecione ao menos um arquivo.');return}files.forEach(file=>{if(file.size>15*1024*1024){addToast(file.name+' excede 15 MB.');return}const r=new FileReader();r.onload=()=>{db.attachments.push({id:uid(),orderId:id,userId:currentUser().id,type,name:file.name,size:file.size,mime:file.type,data:r.result,createdAt:iso(now())});const o=db.orders.find(x=>x.id===id);addEvent(o,'ANEXO_ADICIONADO',o.stage,o.stage,'Anexo: '+file.name);save();render()};r.readAsDataURL(file)})}

function usersPage(){if(!isMaster()){route('dashboard');return}layout(`<div class="page-head"><div><span class="eyebrow">SEGURANÇA</span><h1>Usuários & acessos</h1><p>Perfis aderentes ao fluxo operacional.</p></div></div><div class="grid2"><section class="panel"><h2>Novo usuário</h2><form class="stack" onsubmit="createUser(event)"><label>Nome completo<input name="fullName" required></label><label>Usuário<input name="username" required></label><label>Perfil<select name="role">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>Senha<input name="password" minlength="6" required></label><button class="btn primary">Criar usuário</button></form></section><section class="panel"><h2>Matriz de responsabilidade</h2><p><b>FSO:</b> abre OS, monitora, corrige rejeições e encerra.</p><p><b>FED:</b> SO/Delivery, NF e dados logísticos.</p><p><b>RI/Fiscal:</b> audita e aprova/rejeita.</p><p><b>PHL:</b> agenda coleta.</p><p><b>Master:</b> administração, SLA e intervenção excepcional.</p></section></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Status</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${esc(u.fullName)}</b><br><small>${esc(u.username)}</small></td><td>${roleP(u.role)}</td><td>${u.active?'Ativo':'Inativo'}</td><td><button class="btn subtle" onclick="toggleUser('${u.id}')">${u.active?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table></div></section>`,'users')}

const BOARD_VERSION='1.8.0';
function hoursBetween(a,b=Date.now()){if(!a)return 0;return Math.max(0,(new Date(b)-new Date(a))/36e5)}
function formatDuration(h){if(!Number.isFinite(h))return '—';if(h<1)return Math.round(h*60)+' min';const d=Math.floor(h/24),r=h-d*24,hh=Math.floor(r),m=Math.round((r-hh)*60);return d?`${d}d ${hh}h ${m}min`:`${hh}h ${m}min`}
function visibleOrder(o){const u=currentUser();if(!u)return false;if(u.role==='MASTER')return true;if(o.status==='ENCERRADA')return false;if(o.assignedRole!==u.role)return false;return !o.assignedUserId||o.assignedUserId===u.id}
function activeUserForStage(o){if(o.assignedUserId)return db.users.find(u=>u.id===o.assignedUserId);return null}
function stageDuration(s){return hoursBetween(s.startedAt,s.completedAt||Date.now())}
function lifecycleStats(o){const rows=(db.stages||[]).filter(s=>s.orderId===o.id).sort((a,b)=>new Date(a.enteredAt)-new Date(b.enteredAt));let acting=0;rows.forEach(s=>acting+=stageDuration(s));return {rows,acting,total:hoursBetween(o.createdAt,o.closedAt||Date.now())}}
function cycleLife(o){const st=lifecycleStats(o);const completed=st.rows.filter(s=>s.completedAt).length;const people=[...new Set(st.rows.map(s=>s.actorUserId).filter(Boolean))];return `<section class="panel cycle-panel"><div class="panel-head"><div><h2>⏱ Ciclo de vida da OS</h2><p class="muted">Tempo efetivo de atuação por responsável e por etapa.</p></div><div class="cycle-summary"><b>${formatDuration(st.total)}</b><small>ciclo total</small></div></div><div class="cycle-kpis"><div><span>Atuação efetiva</span><b>${formatDuration(st.acting)}</b></div><div><span>Etapas concluídas</span><b>${completed}</b></div><div><span>Responsáveis</span><b>${people.length}</b></div><div><span>Responsável atual</span><b>${esc(activeUserForStage(o)?.fullName||ROLE_SHORT[o.assignedRole]||'Aguardando')}</b></div></div><div class="cycle-list">${st.rows.map((s,i)=>{const u=db.users.find(x=>x.id===s.actorUserId),d=stageDuration(s),pct=st.total?Math.min(100,d/st.total*100):0;return `<div class="cycle-row"><div class="cycle-dot ${s.completedAt?'done':s.stage===o.stage?'current':''}"></div><div class="cycle-main"><div class="cycle-title"><strong>${esc(STAGES[s.stage]?.label||s.stage)}</strong><span class="pill ${s.completedAt?'green':s.stage===o.stage?'blue':'slate'}">${s.completedAt?'Concluída':s.stage===o.stage?'Em atuação':'Aguardando'}</span></div><div class="cycle-meta"><span><b>Responsável:</b> ${esc(u?.fullName||ROLE_SHORT[s.role]||s.role||'—')}</span><span><b>Entrada:</b> ${fmt(s.enteredAt)}</span>${s.startedAt?`<span><b>Início:</b> ${fmt(s.startedAt)}</span>`:''}${s.completedAt?`<span><b>Fim:</b> ${fmt(s.completedAt)}</span>`:''}</div><div class="cycle-bar"><i style="width:${pct}%"></i></div><div class="cycle-foot"><span>${s.startedAt?'Tempo de atuação: '+formatDuration(d):'Aguardando início'}</span><span>${s.note?esc(s.note):''}</span></div></div></div>`}).join('')||'<div class="empty">Sem etapas registradas.</div>'}</div></section>`}
function orderAccess(id){const o=db.orders.find(x=>x.id===id);if(!o){route('orders');return null}if(!visibleOrder(o)){addToast('Esta OS não está sob sua responsabilidade.');route('orders');return null}return o}
function load(){try{const x=JSON.parse(localStorage.getItem('cirionBoardFlow'));if(x&&Array.isArray(x.users)){db=x}else{db={users:[],orders:[],events:[],stages:[],attachments:[],drafts:[],settings:{...DEFAULTS},session:null}}}catch(e){db={users:[],orders:[],events:[],stages:[],attachments:[],drafts:[],settings:{...DEFAULTS},session:null}}if(!db.settings)db.settings={...DEFAULTS};Object.keys(DEFAULTS).forEach(k=>{if(db.settings[k]==null)db.settings[k]=DEFAULTS[k]});if(!Array.isArray(db.orders))db.orders=[];if(!Array.isArray(db.events))db.events=[];if(!Array.isArray(db.stages))db.stages=[];if(!Array.isArray(db.attachments))db.attachments=[];if(!Array.isArray(db.users)||!db.users.length)db.users=DEMO_USERS.map((u,i)=>({id:'u'+(i+1),username:u[0],fullName:u[1],role:u[2],password:u[3],active:true,createdAt:iso(now())}));if(!db.metaVersion)db.metaVersion='1.9.0';}
function render(){load();if(!db.session){login();return}const [view,arg]=location.hash.replace('#','').split('/');if(view==='order'&&arg){orderDetail(arg);return}if(view==='new'){newOrderPage();return}if(view==='orders'){ordersPage(false);return}if(view==='mine'){ordersPage(true);return}if(view==='users'){usersPage();return}if(view==='userkpi'&&arg){userKpiPage(arg);return}if(view==='settings'){settingsPage();return}if(view==='backup'){backupPage();return}dashboard()}
function transition(o,target,action,note){const old=o.stage;const s=db.stages.find(x=>x.orderId===o.id&&x.stage===old&&!x.completedAt);if(s){s.completedAt=iso(now());s.outcome=action;s.actorUserId=currentUser().id;s.note=note}o.stage=target;o.assignedRole=STAGES[target].role;o.assignedUserId=null;o.status='AGUARDANDO_INICIO';o.stageEnteredAt=iso(now());o.updatedAt=iso(now());addStage(o,target);addEvent(o,action,old,target,note)}
function canAct(o){const u=currentUser();if(!u)return false;if(u.role==='MASTER')return true;if(o.status==='ENCERRADA'||o.assignedRole!==u.role)return false;return !o.assignedUserId||o.assignedUserId===u.id}
function startOrder(id){const o=db.orders.find(x=>x.id===id);if(!o||!canStart(o)||!visibleOrder(o))return;o.status='EM_TRATATIVA';o.assignedUserId=currentUser().id;o.updatedAt=iso(now());const s=db.stages.find(x=>x.orderId===id&&x.stage===o.stage&&!x.startedAt);if(s){s.startedAt=iso(now());s.actorUserId=currentUser().id}else{const ns=db.stages.find(x=>x.orderId===id&&x.stage===o.stage&&!x.completedAt);if(ns){ns.startedAt=iso(now());ns.actorUserId=currentUser().id}}addEvent(o,'INICIADA',o.stage,o.stage,'Tratativa iniciada pelo responsável.');save();render()}
function orderRow(o){const si=slaInfo(o),assigned=db.users.find(u=>u.id===o.assignedUserId)?.fullName||ROLE_SHORT[o.assignedRole]||'—',stageElapsed=o.status==='ENCERRADA'?0:hoursBetween(o.stageEnteredAt);return `<tr onclick="route('order','${o.id}')"><td><b>${esc(o.osCode||o.taskNumber)}</b><br><small>${esc(o.taskNumber)}</small></td><td>${esc(o.siteId||'—')}</td><td>${esc(o.descriptionModel||'—')}</td><td>${esc(STAGES[o.stage]?.label||o.stage)}</td><td>${statusP(o.status)}</td><td>${priorityP(o.priority)}</td><td>${esc(assigned)}</td><td><b>${formatDuration(stageElapsed)}</b><br><span class="pill ${si[1]}">${esc(si[0])}</span></td><td>${o.pickupScheduledAt?fmt(o.pickupScheduledAt):'—'}</td></tr>`}
function ordersPage(onlyMine=false){let q=new URLSearchParams(location.hash.includes('?')?location.hash.split('?')[1]:'').get('q')||'';const title=onlyMine?'Minhas OS':'Ordens de Serviço';layout(`<div class="page-head"><div><span class="eyebrow">${onlyMine?'ACOMPANHAMENTO PESSOAL':'FILA OPERACIONAL'}</span><h1>${title}</h1><p>${onlyMine?'Somente OS atualmente sob sua responsabilidade.':'Pesquisar por Task, OS, site, SAP, serial, RMA, SO ou NF.'}</p></div><div class="actions"><button class="btn ghost no-print" onclick="exportOrdersCSV(${onlyMine})">⇩ Exportar CSV</button><button class="btn primary no-print" onclick="route('new')" ${['FSO','MASTER'].includes(currentUser().role)?'':'disabled'}>＋ Nova OS</button></div></div><section class="panel no-print"><div class="filters"><input id="orderSearch" value="${esc(q)}" placeholder="Buscar Task, OS, SAP, serial, RMA, SO, NF..." oninput="filterOrders(${onlyMine})"><select id="stageFilter" onchange="filterOrders(${onlyMine})"><option value="">Todas as etapas</option>${Object.entries(STAGES).map(([k,v])=>`<option value="${k}">${esc(v.label)}</option>`).join('')}</select><select id="statusFilter" onchange="filterOrders(${onlyMine})"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="priorityFilter" onchange="filterOrders(${onlyMine})"><option value="">Todas prioridades</option>${Object.entries(PRIOR).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="slaFilter" onchange="filterOrders(${onlyMine})"><option value="">Todos SLA</option><option value="red">Vencido</option><option value="amber">Atenção</option><option value="green">No prazo</option></select></div></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>OS / Task</th><th>Site</th><th>Material</th><th>Etapa</th><th>Status</th><th>Prioridade</th><th>Responsável</th><th>Tempo etapa / SLA</th><th>Coleta</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>`,'orders');filterOrders(onlyMine)}
function filterOrders(onlyMine=false){const q=($('#orderSearch')?.value||'').toLowerCase().trim(),sf=$('#stageFilter')?.value||'',st=$('#statusFilter')?.value||'',pf=$('#priorityFilter')?.value||'',slaf=$('#slaFilter')?.value||'',u=currentUser();let rows=db.orders.filter(o=>{if(!visibleOrder(o))return false;if(onlyMine&&o.assignedUserId!==u.id)return false;if(sf&&o.stage!==sf)return false;if(st&&o.status!==st)return false;if(pf&&o.priority!==pf)return false;if(slaf&&slaInfo(o)[1]!==slaf)return false;if(!q)return true;return [o.osCode,o.taskNumber,o.siteId,o.siteName,o.sapCode,o.serialInstalled,o.serialRemoved,o.rmaNumber,o.soNumber,o.nfNumber,o.deliveryNumber].join(' ').toLowerCase().includes(q)});rows.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));$('#ordersBody').innerHTML=rows.map(orderRow).join('')||`<tr><td colspan="9"><div class="empty">Nenhuma OS encontrada.</div></td></tr>`}
function donutCard(title,total,items,center,subtitle){const sum=items.reduce((a,x)=>a+x.value,0)||1;let acc=0;const stops=items.map(x=>{const a=acc;acc+=x.value/sum*360;return `${x.color} ${a}deg ${acc}deg`}).join(',');return `<section class="exec-card"><div class="exec-head"><div><h2>${esc(title)}</h2><small>${esc(subtitle)}</small></div><strong>${esc(center)}</strong></div><div class="exec-body"><div class="donut" style="background:conic-gradient(${stops})"><div><b>${esc(String(total))}</b><small>total</small></div></div><div class="legend">${items.map(x=>`<div><span><i style="background:${x.color}"></i>${esc(x.label)}</span><b>${x.value}</b></div>`).join('')}</div></div></section>`}

/* RMA_FLOW 1.0 - Comunicação e escalonamento */
function escCfg(){
  if(!db.settings) db.settings={...DEFAULTS};
  Object.keys(DEFAULTS).forEach(k=>{if(db.settings[k]===undefined)db.settings[k]=DEFAULTS[k]});
  if(!db.settings.escalationSent||typeof db.settings.escalationSent!=='object')db.settings.escalationSent={};
  return db.settings;
}
function escKey(o,level){return `${o.id}|${o.stage}|${level}`}
function escalationLevel(o){
  if(!o||o.status==='ENCERRADA')return 0;
  const sla=stageSla(o); if(!sla||!o.stageEnteredAt)return 0;
  const pct=(hoursBetween(o.stageEnteredAt)/sla)*100;
  const c=escCfg();
  if(pct>=Number(c.escalation120||120))return 120;
  if(pct>=Number(c.escalation100||100))return 100;
  if(pct>=Number(c.escalation80||80))return 80;
  return 0;
}
function escalationMessage(o,level){
  const c=escCfg(), sla=stageSla(o)||0, elapsed=hoursBetween(o.stageEnteredAt), rem=sla-elapsed;
  const user=db.users.find(u=>u.id===o.assignedUserId);
  const template=level===120?c.escalationTemplate120:level===100?c.escalationTemplate100:c.escalationTemplate80;
  return String(template||'').replaceAll('{OS}',o.osCode||o.taskNumber||'OS').replaceAll('{ETAPA}',STAGES[o.stage]?.label||o.stage).replaceAll('{RESPONSAVEL}',user?.fullName||ROLE_SHORT[o.assignedRole]||'Não atribuído').replaceAll('{RESTANTE}',formatDuration(Math.max(0,rem))).replaceAll('{ATRASO}',formatDuration(Math.max(0,elapsed-sla))).replaceAll('{SITE}',o.siteName||o.siteId||'').replaceAll('{SAP}',o.sapCode||'');
}
function markEscalation(o,level){
  const c=escCfg(), key=escKey(o,level); if(c.escalationSent[key])return false;
  c.escalationSent[key]={at:iso(now()),stage:o.stage};
  addEvent(o,'ESCALAMENTO_SLA',o.stage,o.stage,`Nível ${level}%: ${escalationMessage(o,level)}`);
  return true;
}
function browserNotify(title,msg){
  if(!('Notification' in window))return;
  if(Notification.permission==='granted')new Notification(title,{body:msg});
}
function checkEscalations(){
  const c=escCfg(); let changed=false;
  db.orders.filter(o=>o.status!=='ENCERRADA').forEach(o=>{
    const lvl=escalationLevel(o); if(!lvl)return;
    if(markEscalation(o,lvl)){
      changed=true;
      const msg=escalationMessage(o,lvl);
      if(c.notifyBrowser)browserNotify(`RMA_FLOW · Escalonamento ${lvl}%`,msg);
    }
  });
  if(changed)save();
}
function requestBrowserPermission(){if('Notification' in window)Notification.requestPermission().then(()=>addToast('Permissão de notificações atualizada.'));else addToast('Este navegador não suporta notificações.');}
function waLink(message){const c=escCfg();const nums=String(c.waRecipients||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);const target=nums[0]||'';return `https://wa.me/${target.replace(/\D/g,'')}?text=${encodeURIComponent(message)}`}
function emailLink(subject,message){const c=escCfg();return `mailto:${encodeURIComponent(String(c.emailRecipients||'').split(/[,;\n]+/)[0]||'')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`}
function openEscalationChannel(orderId,level,channel){const o=db.orders.find(x=>x.id===orderId);if(!o)return;const msg=escalationMessage(o,level);markEscalation(o,level);save();
  if(channel==='whatsapp')window.open(waLink(msg),'_blank');
  else if(channel==='email')window.location.href=emailLink(`RMA_FLOW - Escalonamento SLA ${level}% - ${o.osCode||o.taskNumber}`,msg);
  else if(channel==='teams'){const c=escCfg();if(c.teamsWebhook){navigator.clipboard?.writeText(msg);window.open(c.teamsWebhook,'_blank');addToast('Mensagem copiada. O Teams foi aberto para envio/validação do webhook.');}else{navigator.clipboard?.writeText(msg);addToast('Webhook do Teams não configurado. Mensagem copiada.');}}
  else {browserNotify(`RMA_FLOW · SLA ${level}%`,msg);addToast('Notificação do navegador disparada.');}
  render();
}
function pendingEscalations(){
  return db.orders.filter(o=>o.status!=='ENCERRADA').map(o=>({o,level:escalationLevel(o)})).filter(x=>x.level);
}

    <div class="form-grid"><label>Nível 1 · em risco (%)<input name="escalation80" type="number" min="1" max="500" value="${c.escalation80}"></label><label>Nível 2 · SLA vencido (%)<input name="escalation100" type="number" min="1" max="500" value="${c.escalation100}"></label><label>Nível 3 · crítico (%)<input name="escalation120" type="number" min="1" max="500" value="${c.escalation120}"></label><label>WhatsApp · números (DDI + DDD)<input name="waRecipients" placeholder="5511999999999;5521999999999" value="${esc(c.waRecipients)}"></label><label class="span2">Teams · URL/webhook ou canal de encaminhamento<input name="teamsWebhook" placeholder="https://..." value="${esc(c.teamsWebhook)}"></label><label class="span2">E-mail · destinatários<input name="emailRecipients" placeholder="gestao@empresa.com;operacao@empresa.com" value="${esc(c.emailRecipients)}"></label></div>
    <div class="check-grid"><label><input type="checkbox" name="notifyWhatsApp" ${c.notifyWhatsApp?'checked':''}> WhatsApp</label><label><input type="checkbox" name="notifyTeams" ${c.notifyTeams?'checked':''}> Microsoft Teams</label><label><input type="checkbox" name="notifyEmail" ${c.notifyEmail?'checked':''}> E-mail</label><label><input type="checkbox" name="notifyBrowser" ${c.notifyBrowser?'checked':''}> Notificação do navegador</label></div>
    <div class="panel-head" style="margin-top:18px"><div><h2>Modelos de mensagem</h2><p class="muted">Variáveis: {OS}, {ETAPA}, {RESPONSAVEL}, {RESTANTE}, {ATRASO}, {SITE}, {SAP}</p></div></div>
    <div class="stack"><label>Nível 1 · risco de SLA<textarea name="escalationTemplate80" rows="2">${esc(c.escalationTemplate80)}</textarea></label><label>Nível 2 · SLA vencido<textarea name="escalationTemplate100" rows="2">${esc(c.escalationTemplate100)}</textarea></label><label>Nível 3 · escalonamento crítico<textarea name="escalationTemplate120" rows="2">${esc(c.escalationTemplate120)}</textarea></label></div>
    <div class="actions"><button class="btn success">💾 Salvar configurações</button></div>
  </form>
  <section class="panel"><div class="panel-head"><div><h2>Escalonamentos ativos</h2><p class="muted">OS que já atingiram algum nível de alerta.</p></div></div>${pending.map(x=>`<div class="notice" style="margin:8px 0"><b>${esc(x.o.osCode||x.o.taskNumber)}</b> · ${esc(STAGES[x.o.stage]?.label||x.o.stage)} · <b>Nível ${x.level}%</b><div class="muted" style="margin-top:4px">${esc(escalationMessage(x.o,x.level))}</div><div class="actions" style="margin-top:8px"><button class="btn ghost" onclick="openEscalationChannel('${x.o.id}',${x.level},'whatsapp')" ${c.notifyWhatsApp?'':'disabled'}>WhatsApp</button><button class="btn ghost" onclick="openEscalationChannel('${x.o.id}',${x.level},'teams')" ${c.notifyTeams?'':'disabled'}>Teams</button><button class="btn ghost" onclick="openEscalationChannel('${x.o.id}',${x.level},'email')" ${c.notifyEmail?'':'disabled'}>E-mail</button><button class="btn subtle" onclick="openEscalationChannel('${x.o.id}',${x.level},'browser')">🔔 Notificar</button></div></div>`).join('')||'<div class="empty">Nenhum escalonamento pendente no momento.</div>'}</section>`, 'settings');
}
function saveSettings(e){
  e.preventDefault(); const f=readForm(e.target), c=escCfg();
  ['globalSla','slaFedSo','slaFiscal','slaFedNf','slaPhl','slaFsoCorrection','escalation80','escalation100','escalation120'].forEach(k=>c[k]=Number(f[k]||DEFAULTS[k]));
  ['waRecipients','teamsWebhook','emailRecipients','escalationTemplate80','escalationTemplate100','escalationTemplate120'].forEach(k=>c[k]=f[k]??'');
  ['notifyWhatsApp','notifyTeams','notifyEmail','notifyBrowser'].forEach(k=>c[k]=!!e.target.elements[k]?.checked);
  save(); addToast('Configurações de comunicação e escalonamento salvas.'); render();
}

/* clean startup: preserve users/settings, remove stale OS once */
window.addEventListener('hashchange',render);
load();
checkEscalations();
render();
setTimeout(()=>{const sap=document.getElementById('sapCode'); if(sap && sap.value) lookupSapDescription(sap.value,true);},0);setInterval(()=>{if(db.session){checkEscalations();if(location.hash.includes('dashboard')||location.hash.includes('settings'))render()}},60000);

</script></body></html>
